apiVersion: apps/v1
kind: Deployment
metadata:
  name: edureka-devops-abstergo-corp
  namespace: abstergo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edureka-devops-abstergo-corp
  template:
    metadata:
      labels:
        app: edureka-devops-abstergo-corp
    spec:
      containers:
        - name: edureka-devops-abstergo-corp
          image: docker.io/hvijay1705/edureka-devops-abstergo-corp:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20